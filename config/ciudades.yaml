# Páginas locales para SEO. Cada combinación ciudad + riesgo genera una página.
# "riesgos" usa claves de config/riesgos.yaml.
# "antecedente" (opcional) es un evento real que la gente de la ciudad recuerda; da contexto
# local a la página. Agrega solo datos que puedas verificar.
ciudades:
