# CATÁLOGO DE PRODUCTOS — este es el único archivo que necesitas editar.
#
# Campos de cada producto:
#   id            identificador corto, sin espacios (no lo cambies después de publicar)
#   nombre        nombre que verá el visitante
#   categoria     agrupa los productos en la página
#   nivel         primer kit en que aparece: minimo | maximo | plus
#                 (lo que está en "minimo" también sale en Máximo y Plus)
#   url           liga normal del producto en Mercado Libre
#   afiliado      liga corta que te da el Generador de links (meli.la/...). Si está vacía,
#                 el sitio usa la url normal y NO cobras comisión; el aviso diario te lo recuerda.
#   ml_id         ID que aparece en la url (MLM12345678 o MLM-1234567890 sin guion)
#   ml_tipo       "producto" si la url es /p/MLM..., "item" si es articulo.mercadolibre...
#   precio_ref    precio de referencia; el robot diario lo actualiza en datos/precios.json
#   rinde         cuántas unidades trae un paquete
#   unidad        cómo se llaman esas unidades (sobres, barras, litros...)
#   consumo       unidades necesarias para 72 h: por_adulto, por_nino y/o fijo
#   solo_con_ninos  true si solo aplica cuando la familia tiene niños
#   escala_raciones true si se multiplica en el kit Plus (comida y bebida)
#   compra_local  true si conviene comprarlo en la tienda de la esquina (no lleva liga)
#   lugar_compra  dónde comprarlo si es compra_local (ej. Farmacia)
#   nota          texto corto opcional que se muestra bajo el producto

