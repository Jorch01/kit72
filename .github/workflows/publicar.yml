name: Actualizar precios y publicar

on:
  push:
    branches: [main]
  schedule:
    # Todos los días a las 7:17 de Cancún (12:17 UTC)
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      codigo_ml:
        description: "Código de autorización de Mercado Libre (TG-...). Solo la primera vez o al re-autorizar."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyyaml

      - name: Revisar precios en Mercado Libre
        id: precios
        continue-on-error: true
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_AUTH_CODE: ${{ inputs.codigo_ml }}
        run: python scripts/actualizar_precios.py

      - name: Guardar la autorización renovada de Mercado Libre
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ARCHIVO="$RUNNER_TEMP/ml_refresh_token"
          if [ ! -s "$ARCHIVO" ]; then echo "Sin autorización nueva que guardar."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el Secret GH_PAT; no se pudo guardar la autorización renovada."
          else
            gh secret set ML_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$ARCHIVO" && echo "Autorización renovada y guardada."
          fi
          rm -f "$ARCHIVO"

      - name: Guardar precios en el repo
        run: |
          git config user.name "kit72-bot"
          git config user.email "kit72-bot@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Precios actualizados $(date -u +%F)"
          git push || echo "Sin cambios que subir"

      - name: Avisarte si hay algo que hacer
        if: steps.precios.outputs.requiere_accion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="Kit72: productos por revisar"
          NUM=$(gh issue list --state open --search "$TITULO in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file datos/reporte.md
          else
            gh issue create --title "$TITULO" --body-file datos/reporte.md
          fi

      - name: Cerrar el aviso si ya no hay pendientes
        if: steps.precios.outputs.requiere_accion == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Kit72: productos por revisar in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Todo en orden en la revisión de hoy. Si vuelve a haber pendientes, se abrirá un aviso nuevo."
          fi

      - name: Generar sitio
        run: python scripts/generar_sitio.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
